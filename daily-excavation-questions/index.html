<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1f2430;
      --muted: #6b7280;
      --accent: #5b4636;
      --accent-light: #efe7df;
      --bg: #faf8f5;
      --card: #ffffff;
      --border: #e4ddd3;
      --good: #3f7d5c;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 0 0 40px;
      overflow-x: hidden;
    }
    header {
      padding: 20px 16px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: relative;
    }
    header h1 {
      font-size: 1.25rem;
      margin: 0 0 8px;
    }
    #stats-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    #stats-row .stat {
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 600;
    }
    #save-now-btn {
      position: absolute;
      top: 16px;
      right: 14px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: var(--accent);
      cursor: pointer;
    }
    #toast {
      font-size: 0.8rem;
      color: var(--good);
      min-height: 1.2em;
    }
    #dots-row {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 4px 16px 0;
    }
    .dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }
    .dot.answered {
      background: var(--good);
      border-color: var(--good);
      color: #fff;
    }
    .dot.current {
      transform: scale(1.15);
      border-color: var(--accent);
    }
    main {
      max-width: 560px;
      margin: 20px auto 0;
      padding: 0 16px;
    }
    #banner {
      text-align: center;
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card .eyebrow {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 6px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .card h2 {
      font-size: 1.08rem;
      margin: 0 0 14px;
      line-height: 1.4;
    }
    textarea {
      width: 100%;
      min-height: 76px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.98rem;
      font-family: inherit;
      resize: vertical;
      background: #fffefc;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .sparks-label {
      margin: 16px 0 8px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }
    .sample {
      text-align: left;
      width: 100%;
      background: #faf7f2;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .sample.used {
      border-color: var(--good);
      background: #f1f8f4;
    }
    .sample p {
      margin: 0 0 8px;
      font-size: 0.88rem;
      color: #3a3f4b;
      font-style: italic;
    }
    .sample .used-tag {
      display: none;
      font-size: 0.76rem;
      color: var(--good);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .sample.used .used-tag { display: block; }
    .rating-row {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      align-items: center;
    }
    .rating-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-right: 4px;
    }
    .rating-btn {
      width: 23px;
      height: 23px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.72rem;
      cursor: pointer;
      color: var(--ink);
      padding: 0;
    }
    .rating-btn.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border-radius: 999px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .nav-btn.back {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--ink);
    }
    .nav-btn.next {
      background: var(--accent);
      color: #fff;
    }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }
    #celebrate {
      text-align: center;
      padding: 30px 16px;
      display: none;
    }
    #celebrate h2 { font-size: 1.4rem; margin-bottom: 6px; }
    #celebrate p { color: var(--muted); margin: 4px 0; }
    #celebrate .big-streak {
      font-size: 2.4rem;
      margin: 10px 0;
    }
    #celebrate a, #celebrate button {
      display: inline-block;
      margin-top: 16px;
      margin-right: 8px;
    }
    .link-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 18px;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .confetti-piece {
      position: fixed;
      top: -20px;
      font-size: 1.4rem;
      pointer-events: none;
      animation-name: fall;
      animation-timing-function: ease-in;
      animation-fill-mode: forwards;
      z-index: 999;
    }
    @keyframes fall {
      to { transform: translateY(100vh) rotate(360deg); opacity: 0.2; }
    }
  </style>
</head>
<body>
  <header>
    <button id="save-now-btn">💾 Save now</button>
    <h1>The Seven Excavation Questions</h1>
    <div id="stats-row"></div>
    <div id="toast"></div>
  </header>

  <div id="dots-row"></div>

  <main>
    <div id="banner"></div>
    <div id="card-root"></div>
    <div id="celebrate">
      <div class="big-streak">🔥</div>
      <h2>Day complete!</h2>
      <p id="celebrate-streak"></p>
      <p id="celebrate-sub"></p>
      <button class="link-btn" id="review-btn">Review / edit answers</button>
      <a class="link-btn" id="celebrate-sheet-link" href="#" target="_top">Open spreadsheet</a>
    </div>
  </main>

  <script>
    var todayData = null;
    var currentIndex = 0;

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.innerText = str || '';
      return div.innerHTML;
    }

    function renderStats(stats) {
      var streakText = stats.streak > 0
        ? '🔥 ' + stats.streak + '-day streak'
        : '🔥 Start a streak today';
      document.getElementById('stats-row').innerHTML =
        '<span class="stat">' + streakText + '</span>' +
        '<span class="stat">' + stats.level.emoji + ' ' + stats.level.title + '</span>' +
        '<span class="stat">' + stats.totalDays + ' days practiced</span>';
    }

    function renderDots() {
      var row = document.getElementById('dots-row');
      row.innerHTML = '';
      todayData.questions.forEach(function (q, i) {
        var dot = document.createElement('div');
        var answered = q.response && q.response.trim().length > 0;
        dot.className = 'dot' + (answered ? ' answered' : '') + (i === currentIndex ? ' current' : '');
        dot.textContent = answered ? '✓' : (i + 1);
        dot.addEventListener('click', function () {
          captureCurrentCard();
          currentIndex = i;
          renderCard();
          renderDots();
        });
        row.appendChild(dot);
      });
    }

    function ratingRowHtml(qIndex, sIndex, currentRating) {
      var buttons = '';
      for (var n = 1; n <= 10; n++) {
        var selected = (currentRating === n) ? ' selected' : '';
        buttons += '<button type="button" class="rating-btn' + selected + '" ' +
          'data-q="' + qIndex + '" data-s="' + sIndex + '" data-val="' + n + '">' + n + '</button>';
      }
      return '<div class="rating-row"><span class="rating-label">Resonance:</span>' + buttons + '</div>';
    }

    function renderCard() {
      document.getElementById('celebrate').style.display = 'none';
      document.getElementById('card-root').style.display = 'block';

      var q = todayData.questions[currentIndex];
      var root = document.getElementById('card-root');

      var html = '<div class="card">';
      html += '<p class="eyebrow">Question ' + (currentIndex + 1) + ' of 7</p>';
      html += '<h2>' + escapeHtml(q.text) + '</h2>';
      html += '<textarea id="response-box" placeholder="One sentence is plenty&hellip;">' + escapeHtml(q.response) + '</textarea>';
      html += '<p class="sparks-label">✨ Tap one that resonates, or write your own above</p>';

      q.samples.forEach(function (sample, sIndex) {
        var used = (q.response || '').trim() === sample.trim();
        html += '<div class="sample' + (used ? ' used' : '') + '" data-sample="' + sIndex + '">';
        html += '<div class="used-tag">✓ used as your answer</div>';
        html += '<p>&ldquo;' + escapeHtml(sample) + '&rdquo;</p>';
        html += ratingRowHtml(currentIndex, sIndex, q.ratings[sIndex]);
        html += '</div>';
      });

      html += '<div class="nav-row">';
      html += '<button class="nav-btn back" id="back-btn"' + (currentIndex === 0 ? ' disabled' : '') + '>&larr; Back</button>';
      html += '<button class="nav-btn next" id="next-btn">' + (currentIndex === 6 ? 'Finish ✓' : 'Next →') + '</button>';
      html += '</div>';
      html += '</div>';

      root.innerHTML = html;

      root.querySelectorAll('.sample').forEach(function (el) {
        el.addEventListener('click', function (evt) {
          if (evt.target.classList.contains('rating-btn')) return;
          var sIndex = parseInt(el.getAttribute('data-sample'), 10);
          var text = todayData.questions[currentIndex].samples[sIndex];
          document.getElementById('response-box').value = text;
          todayData.questions[currentIndex].response = text;
          root.querySelectorAll('.sample').forEach(function (s) { s.classList.remove('used'); });
          el.classList.add('used');
          renderDots();
        });
      });

      root.querySelectorAll('.rating-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var sIndex = parseInt(btn.getAttribute('data-s'), 10);
          var val = parseInt(btn.getAttribute('data-val'), 10);
          todayData.questions[currentIndex].ratings[sIndex] = val;
          var container = btn.closest('.sample');
          container.querySelectorAll('.rating-btn').forEach(function (b) {
            b.classList.toggle('selected', b === btn);
          });
        });
      });

      document.getElementById('response-box').addEventListener('input', function (e) {
        todayData.questions[currentIndex].response = e.target.value;
        renderDots();
      });

      document.getElementById('back-btn').addEventListener('click', function () {
        captureCurrentCard();
        currentIndex--;
        renderCard();
        renderDots();
      });

      document.getElementById('next-btn').addEventListener('click', function () {
        captureCurrentCard();
        if (currentIndex < 6) {
          currentIndex++;
          renderCard();
          renderDots();
        } else {
          finishAndSave();
        }
      });
    }

    function captureCurrentCard() {
      var box = document.getElementById('response-box');
      if (box) todayData.questions[currentIndex].response = box.value;
    }

    function collectPayload() {
      var questions = todayData.questions.map(function (q) {
        return { response: (q.response || '').trim(), samples: q.samples, ratings: q.ratings };
      });
      return { date: todayData.date, questions: questions };
    }

    function burstConfetti() {
      var emojis = ['🎉', '✨', '🔥', '🌱', '🕊️'];
      for (var i = 0; i < 26; i++) {
        var span = document.createElement('span');
        span.className = 'confetti-piece';
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDuration = (2 + Math.random() * 1.5) + 's';
        span.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(span);
        (function (el) { setTimeout(function () { el.remove(); }, 4000); })(span);
      }
    }

    function finishAndSave() {
      var nextBtn = document.getElementById('next-btn');
      if (nextBtn) { nextBtn.disabled = true; nextBtn.textContent = 'Saving…'; }

      google.script.run
        .withSuccessHandler(function (result) {
          renderStats(result.stats);
          showCelebration(result.stats);
        })
        .withFailureHandler(function (err) {
          if (nextBtn) { nextBtn.disabled = false; nextBtn.textContent = 'Finish ✓'; }
          document.getElementById('toast').textContent = 'Save failed: ' + (err && err.message ? err.message : err);
        })
        .submitResponses(collectPayload());
    }

    function showCelebration(stats) {
      document.getElementById('card-root').style.display = 'none';
      var el = document.getElementById('celebrate');
      el.style.display = 'block';
      document.getElementById('celebrate-streak').textContent =
        stats.streak > 1 ? ('🔥 ' + stats.streak + '-day streak — keep it going!') : 'First day logged — a streak starts now.';
      document.getElementById('celebrate-sub').textContent =
        stats.level.emoji + ' ' + stats.level.title + ' · ' + stats.totalDays + ' days practiced · longest streak ' + stats.longestStreak;
      document.getElementById('celebrate-sheet-link').href = todayData.sheetUrl;
      burstConfetti();
    }

    document.getElementById('review-btn').addEventListener('click', function () {
      currentIndex = 0;
      renderCard();
      renderDots();
    });

    document.getElementById('save-now-btn').addEventListener('click', function () {
      captureCurrentCard();
      var toast = document.getElementById('toast');
      toast.textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (result) {
          toast.textContent = 'Saved ✓';
          renderStats(result.stats);
          renderDots();
          setTimeout(function () { toast.textContent = ''; }, 2000);
        })
        .withFailureHandler(function (err) {
          toast.textContent = 'Save failed: ' + (err && err.message ? err.message : err);
        })
        .submitResponses(collectPayload());
    });

    function init(data) {
      todayData = data;
      renderStats(data.stats);
      if (data.hasExisting) {
        var banner = document.getElementById('banner');
        banner.style.display = 'block';
        banner.textContent = "Continuing today's entry — saving again updates today's row.";
      }
      renderDots();
      renderCard();
    }

    google.script.run.withSuccessHandler(init).getTodayData();
  </script>
</body>
</html>
