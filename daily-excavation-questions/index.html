<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1f2430;
      --muted: #6b7280;
      --accent: #5b4636;
      --accent-light: #efe7df;
      --bg: #faf8f5;
      --card: #ffffff;
      --border: #e4ddd3;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 0 0 60px;
    }
    header {
      padding: 28px 20px 18px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    header h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    #status-banner {
      max-width: 640px;
      margin: 16px auto 0;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 0.9rem;
      display: none;
      text-align: center;
    }
    main {
      max-width: 640px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .question-card h2 {
      font-size: 1.02rem;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .q-num {
      display: inline-block;
      color: var(--accent);
      font-weight: 700;
      margin-right: 6px;
    }
    textarea {
      width: 100%;
      min-height: 70px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.98rem;
      font-family: inherit;
      resize: vertical;
      background: #fffefc;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    details {
      margin-top: 12px;
    }
    summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      user-select: none;
    }
    .sample {
      margin: 12px 0 0;
      padding: 10px 12px;
      background: #faf7f2;
      border-left: 3px solid var(--accent-light);
      border-radius: 6px;
    }
    .sample p {
      margin: 0 0 8px;
      font-size: 0.9rem;
      color: #3a3f4b;
      font-style: italic;
    }
    .rating-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }
    .rating-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-right: 4px;
    }
    .rating-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--ink);
    }
    .rating-btn.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .submit-bar {
      max-width: 640px;
      margin: 8px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #submit-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 13px 28px;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      max-width: 300px;
    }
    #submit-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #save-msg {
      font-size: 0.88rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    #sheet-link {
      font-size: 0.85rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>The Seven Excavation Questions</h1>
    <p id="date-label">Loading today's date&hellip;</p>
    <div id="status-banner"></div>
  </header>

  <main id="questions-root">
    <p style="text-align:center; color: var(--muted);">Loading&hellip;</p>
  </main>

  <div class="submit-bar">
    <button id="submit-btn" disabled>Save today's answers</button>
    <div id="save-msg"></div>
    <a id="sheet-link" href="#" target="_top">Open the spreadsheet &rarr;</a>
  </div>

  <script>
    var todayData = null;

    function ratingRowHtml(qIndex, sIndex, currentRating) {
      var buttons = '';
      for (var n = 1; n <= 10; n++) {
        var selected = (currentRating === n) ? ' selected' : '';
        buttons += '<button type="button" class="rating-btn' + selected + '" ' +
          'data-q="' + qIndex + '" data-s="' + sIndex + '" data-val="' + n + '">' + n + '</button>';
      }
      return '<div class="rating-row"><span class="rating-label">Resonance:</span>' + buttons + '</div>';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    function render(data) {
      todayData = data;
      document.getElementById('date-label').textContent = 'Today, ' + data.date;
      document.getElementById('sheet-link').href = data.sheetUrl;

      var banner = document.getElementById('status-banner');
      if (data.hasExisting) {
        banner.style.display = 'block';
        banner.textContent = "You've already answered today — saving again will update today's entry.";
      }

      var root = document.getElementById('questions-root');
      root.innerHTML = '';

      data.questions.forEach(function (q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card';

        var html = '<h2><span class="q-num">Q' + q.number + '.</span>' + escapeHtml(q.text) + '</h2>';
        html += '<textarea id="response-' + qIndex + '" placeholder="One sentence is plenty&hellip;">' + escapeHtml(q.response) + '</textarea>';
        html += '<details><summary>Need a spark? See example beliefs</summary>';
        q.samples.forEach(function (sample, sIndex) {
          html += '<div class="sample" data-sample-container="' + qIndex + '-' + sIndex + '">';
          html += '<p>&ldquo;' + escapeHtml(sample) + '&rdquo;</p>';
          html += ratingRowHtml(qIndex, sIndex, q.ratings[sIndex]);
          html += '</div>';
        });
        html += '</details>';

        card.innerHTML = html;
        root.appendChild(card);
      });

      root.querySelectorAll('.rating-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var qIndex = parseInt(btn.getAttribute('data-q'), 10);
          var sIndex = parseInt(btn.getAttribute('data-s'), 10);
          var val = parseInt(btn.getAttribute('data-val'), 10);
          todayData.questions[qIndex].ratings[sIndex] = val;

          var container = btn.closest('.sample');
          container.querySelectorAll('.rating-btn').forEach(function (b) {
            b.classList.toggle('selected', b === btn);
          });
        });
      });

      document.getElementById('submit-btn').disabled = false;
    }

    function collectPayload() {
      var questions = todayData.questions.map(function (q, qIndex) {
        return {
          response: document.getElementById('response-' + qIndex).value.trim(),
          samples: q.samples,
          ratings: q.ratings
        };
      });
      return { date: todayData.date, questions: questions };
    }

    document.getElementById('submit-btn').addEventListener('click', function () {
      var btn = document.getElementById('submit-btn');
      var msg = document.getElementById('save-msg');
      btn.disabled = true;
      msg.textContent = 'Saving…';

      google.script.run
        .withSuccessHandler(function () {
          msg.textContent = 'Saved to the spreadsheet.';
          btn.disabled = false;
        })
        .withFailureHandler(function (err) {
          msg.textContent = 'Something went wrong: ' + (err && err.message ? err.message : err);
          btn.disabled = false;
        })
        .submitResponses(collectPayload());
    });

    google.script.run.withSuccessHandler(render).getTodayData();
  </script>
</body>
</html>
